name: APK Android de testes

on:
  workflow_dispatch:
  push:
    branches: [main, android/apk-testes]
    paths:
      - 'IMPORTACAO_PANELAS/**'
      - 'android/**'
      - 'ferramentas/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - 'android-identity.json'
      - '.github/workflows/android-testes.yml'

# Um único fluxo de publicação: não renomear/recriar este arquivo, pois run_number
# é a sequência monotônica usada pelo versionCode. Reexecuções têm códigos próprios.
concurrency:
  group: panelinha-apk-testes
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Conferir assinatura antes de baixar ferramentas
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set +x
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || {
            echo 'Faltam Secrets da assinatura ATIVA da geração 2. Consulte ANDROID.md; não gere outra chave.' >&2
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Instalar SDK fixo
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Instalar dependências fixadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Calcular versão acima do histórico publicado
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 testes/versao_android.py
          python3 ferramentas/versao_android.py >> "$GITHUB_OUTPUT"
      - name: Restaurar assinatura persistente
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set +x
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || {
            echo 'Configure os quatro Secrets descritos em ANDROID.md. Nunca gerar uma chave nova no runner.' >&2
            exit 1
          }
          umask 077
          signing_dir="$RUNNER_TEMP/panelinha-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$KEYSTORE" | base64 --decode > "$signing_dir/panelinha-test.p12"
          printf '%s' "$STORE_PASSWORD" > "$signing_dir/store.password"
          printf '%s' "$KEY_PASSWORD" > "$signing_dir/key.password"
          printf '%s' "$KEY_ALIAS" > "$signing_dir/alias.txt"
      - name: Compilar web, sincronizar e assinar APK real
        id: build
        run: |
          python3 ferramentas/compilar_android.py --secrets-dir "$RUNNER_TEMP/panelinha-signing" --code '${{ steps.version.outputs.code }}' --name '${{ steps.version.outputs.name }}' --test-apk
          cp android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk "$RUNNER_TEMP/panelinha-instrumentation.apk"
          python3 ferramentas/compilar_android.py --secrets-dir "$RUNNER_TEMP/panelinha-signing" --code '${{ steps.version.outputs.nextcode }}' --name '${{ steps.version.outputs.name }}-upgrade-check'
      - name: Habilitar KVM para testes
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar APK offline e atualização preservando dados
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Limita a RAM do AVD para caber no runner hospedado junto ao WebView.
          ram-size: 2048M
          # Backend atual recomendado para runner sem GPU; indirect foi descontinuado.
          # Mantém as animações do app e todos os testes, inclusive imagens/offline.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash ferramentas/testar_android.sh 'artifacts/Panelinha-Teste-v${{ steps.version.outputs.name }}-c${{ steps.version.outputs.code }}.apk' 'artifacts/Panelinha-Teste-v${{ steps.version.outputs.name }}-upgrade-check-c${{ steps.version.outputs.nextcode }}.apk' "$RUNNER_TEMP/panelinha-instrumentation.apk"
      - name: Diagnosticar falha do emulador
        if: failure()
        run: |
          mkdir -p artifacts/testes-android
          free -h > artifacts/testes-android/runner-memory.txt
          sudo dmesg --ctime > artifacts/testes-android/runner-kernel.txt || true
          lscpu > artifacts/testes-android/runner-cpu.txt
          # Relatórios do emulador ficam fora do diretório dos Secrets de assinatura.
          if test -d /tmp/android-runner; then
            mkdir -p artifacts/testes-android/emulator-crash
            while IFS= read -r crash_file; do
              case "$crash_file" in
                *.dmp|*.log)
                  if test "$(stat -c%s "$crash_file")" -lt 20971520; then
                    cp "$crash_file" artifacts/testes-android/emulator-crash/
                  fi
                  ;;
              esac
            done < <(find /tmp/android-runner -type f)
          fi
      - name: Upload de APK e metadados
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Panelinha-Teste-v${{ steps.version.outputs.name }}
          path: |
            artifacts/Panelinha-Teste-v${{ steps.version.outputs.name }}-c${{ steps.version.outputs.code }}.apk
            artifacts/Panelinha-Teste-v${{ steps.version.outputs.name }}-c${{ steps.version.outputs.code }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Guardar resultados Android
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resultados-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/testes-android/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publicar Release de testes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
          RELEASE_CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 ferramentas/notas_release.py "$RELEASE_NAME" "$RELEASE_CODE" > "$RUNNER_TEMP/panelinha-release.md"
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_NAME" >/dev/null; then
            echo 'Tag já existe; publicação interrompida para não anexar um APK a outro código-fonte.' >&2
            exit 1
          else
            ref_status=$?
            test "$ref_status" -eq 2 || exit "$ref_status"
          fi
          gh release create "v$RELEASE_NAME" "artifacts/Panelinha-Teste-v$RELEASE_NAME-c$RELEASE_CODE.apk" "artifacts/Panelinha-Teste-v$RELEASE_NAME-c$RELEASE_CODE.json" --target "$GITHUB_SHA" --title "Panelinha Teste v$RELEASE_NAME" --prerelease --notes-file "$RUNNER_TEMP/panelinha-release.md"
      - name: Limpar material de assinatura do runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/panelinha-signing"
