name: APK Android de testes

on:
  workflow_dispatch:
  push:
    branches: [main, android/apk-testes]
    paths:
      - 'IMPORTACAO_PANELAS/**'
      - 'android/**'
      - 'ferramentas/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - 'android-identity.json'
      - '.github/workflows/android-testes.yml'

# Um único fluxo de publicação: não renomear/recriar este arquivo, pois run_number
# é a sequência monotônica usada pelo versionCode. Reexecuções têm códigos próprios.
concurrency:
  group: panelinha-apk-testes
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Instalar SDK fixo
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Instalar dependências fixadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Calcular versão
        id: version
        shell: python
        run: |
          import os
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert attempt < 50
          code = 1000 + run * 100 + attempt * 2
          assert code < 2100000000
          name = f'0.1.{run}' + (f'-r{attempt}' if attempt > 1 else '')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'code={code}\nnextcode={code + 1}\nname={name}\n')
      - name: Restaurar assinatura persistente
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set +x
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || {
            echo 'Configure os quatro Secrets descritos em ANDROID.md. Nunca gerar uma chave nova no runner.' >&2
            exit 1
          }
          umask 077
          signing_dir="$RUNNER_TEMP/panelinha-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$KEYSTORE" | base64 --decode > "$signing_dir/panelinha-test.p12"
          printf '%s' "$STORE_PASSWORD" > "$signing_dir/store.password"
          printf '%s' "$KEY_PASSWORD" > "$signing_dir/key.password"
          printf '%s' "$KEY_ALIAS" > "$signing_dir/alias.txt"
      - name: Compilar web, sincronizar e assinar APK real
        id: build
        run: |
          python3 ferramentas/compilar_android.py --secrets-dir "$RUNNER_TEMP/panelinha-signing" --code '${{ steps.version.outputs.code }}' --name '${{ steps.version.outputs.name }}' --test-apk
          cp android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk "$RUNNER_TEMP/panelinha-instrumentation.apk"
          python3 ferramentas/compilar_android.py --secrets-dir "$RUNNER_TEMP/panelinha-signing" --code '${{ steps.version.outputs.nextcode }}' --name '${{ steps.version.outputs.name }}-upgrade-check'
      - name: Habilitar KVM para testes
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar APK offline e atualização preservando dados
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ferramentas/testar_android.sh 'artifacts/Panelinha-Teste-v${{ steps.version.outputs.name }}-c${{ steps.version.outputs.code }}.apk' 'artifacts/Panelinha-Teste-v${{ steps.version.outputs.name }}-upgrade-check-c${{ steps.version.outputs.nextcode }}.apk' "$RUNNER_TEMP/panelinha-instrumentation.apk"
      - name: Upload de APK e metadados
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Panelinha-Teste-v${{ steps.version.outputs.name }}
          path: |
            artifacts/Panelinha-Teste-v${{ steps.version.outputs.name }}-c${{ steps.version.outputs.code }}.apk
            artifacts/Panelinha-Teste-v${{ steps.version.outputs.name }}-c${{ steps.version.outputs.code }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Guardar resultados Android
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resultados-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/testes-android/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publicar Release de testes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
          RELEASE_CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 ferramentas/notas_release.py "$RELEASE_NAME" "$RELEASE_CODE" > "$RUNNER_TEMP/panelinha-release.md"
          gh release create "v$RELEASE_NAME" "artifacts/Panelinha-Teste-v$RELEASE_NAME-c$RELEASE_CODE.apk" "artifacts/Panelinha-Teste-v$RELEASE_NAME-c$RELEASE_CODE.json" --target "$GITHUB_SHA" --title "Panelinha Teste v$RELEASE_NAME" --prerelease --notes-file "$RUNNER_TEMP/panelinha-release.md"
      - name: Limpar material de assinatura do runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/panelinha-signing"
